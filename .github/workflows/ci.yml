name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taxagent
          POSTGRES_PASSWORD: taxagent
          POSTGRES_DB: taxagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxagent -d taxagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taxagent:taxagent@127.0.0.1:5432/taxagent
      TAXAGENT_MASTER_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TAXAGENT_BOOTSTRAP_TOKEN: ci-bootstrap-token
      TAXAGENT_AUTH_MODE: required
      TAXAGENT_HOMOLOGATION_CONSOLE_ENABLED: 'true'
      TAXAGENT_NFSE_MODE: mock
      TAXAGENT_LIVE_ENABLED: 'false'
      TAXAGENT_DPS_BUILDER_MODE: draft
      NFSE_TEST_BASE_URL: https://sefin.producaorestrita.nfse.gov.br/API/SefinNacional
      NFSE_PRODUCTION_BASE_URL: https://sefin.nfse.gov.br/SefinNacional
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run database migrations
        run: |
          npm run db:migrate
          npm run db:migrate
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            const prepared = await client.query("SELECT to_regclass('public.prepared_dps') AS name");
            if (prepared.rows[0]?.name !== 'prepared_dps') throw new Error('prepared_dps table missing');
            const intents = await client.query("SELECT to_regclass('public.fiscal_intents') AS name");
            if (intents.rows[0]?.name !== 'fiscal_intents') throw new Error('fiscal_intents table missing');
            const column = await client.query("SELECT column_name FROM information_schema.columns WHERE table_name='invoices' AND column_name='prepared_dps_id'");
            if (column.rowCount !== 1) throw new Error('invoices.prepared_dps_id missing');
            await client.end();
            console.log('Prepared DPS + Fiscal Autopilot migrations: OK');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Boot API and smoke-test browser console against PostgreSQL
        run: |
          npm start > /tmp/taxagent-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              curl --fail --silent --show-error http://127.0.0.1:3000/v1/homologation > /tmp/homologation.html
              grep -q 'Console de Homologação' /tmp/homologation.html
              grep -q 'certificates/upload' /tmp/homologation.html
              grep -q 'Consultoria empresarial padrão (TaxAgent)' /tmp/homologation.html
              grep -q 'Congelar Prepared DPS' /tmp/homologation.html
              grep -q 'operations/dps/prepare' /tmp/homologation.html
              curl --fail --silent --show-error http://127.0.0.1:3000/v1/homologation/autopilot > /tmp/autopilot.html
              grep -q 'Autopilot fiscal' /tmp/autopilot.html
              grep -q 'Resolver e preparar automaticamente' /tmp/autopilot.html
              grep -q 'fiscal/autopilot' /tmp/autopilot.html
              curl --fail --silent --show-error http://127.0.0.1:3000/v1/homologation/company-correction > /tmp/company-correction.html
              grep -q 'Corrigir cadastro da Company' /tmp/company-correction.html

              ORG_ID=$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/v1/organizations \
                -H 'content-type: application/json' -H 'x-taxagent-bootstrap-token: ci-bootstrap-token' \
                -d '{"name":"CI Company Correction"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
              COMP_ID=$(curl --fail --silent --show-error -X POST "http://127.0.0.1:3000/v1/organizations/$ORG_ID/companies" \
                -H 'content-type: application/json' -H 'x-taxagent-bootstrap-token: ci-bootstrap-token' \
                -d '{"name":"CI LTDA","tax_id":"99999999000199","city_code":"3530307","tax_regime":"regular"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
              curl --fail --silent --show-error -X PATCH "http://127.0.0.1:3000/v1/companies/$COMP_ID" \
                -H 'content-type: application/json' -H 'x-taxagent-bootstrap-token: ci-bootstrap-token' \
                -d '{"city_code":"3530607"}' > /tmp/company-corrected.json
              python3 -c 'import json; d=json.load(open("/tmp/company-corrected.json")); assert d["city_code"]=="3530607"'
              echo 'Browser homologation + Fiscal Autopilot + Prepared DPS smoke test: OK'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/taxagent-api.log
          exit 1
      - name: Build and boot deployable Docker image
        run: |
          docker build -t taxagent-ci .
          docker run --rm --entrypoint /bin/sh taxagent-ci -c "test -f dist/database/migrate-cli.js && test -f tax-domains/registry.json && test -f schemas/registry.json && xmllint --version >/dev/null"
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TAXAGENT_MASTER_KEY_B64="$TAXAGENT_MASTER_KEY_B64" \
            -e TAXAGENT_BOOTSTRAP_TOKEN="$TAXAGENT_BOOTSTRAP_TOKEN" \
            -e TAXAGENT_AUTH_MODE=required \
            -e TAXAGENT_HOMOLOGATION_CONSOLE_ENABLED=true \
            -e TAXAGENT_NFSE_MODE=mock \
            -e TAXAGENT_LIVE_ENABLED=false \
            -e TAXAGENT_DPS_BUILDER_MODE=draft \
            -e NFSE_TEST_BASE_URL="$NFSE_TEST_BASE_URL" \
            -e NFSE_PRODUCTION_BASE_URL="$NFSE_PRODUCTION_BASE_URL" \
            taxagent-ci > /tmp/taxagent-docker.log 2>&1 &
          DOCKER_PID=$!
          trap 'kill $DOCKER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v1/health > /tmp/docker-health.json; then
              cat /tmp/docker-health.json
              curl --fail --silent --show-error http://127.0.0.1:3000/v1/homologation > /tmp/docker-homologation.html
              grep -q 'Console de Homologação' /tmp/docker-homologation.html
              grep -q 'certificates/upload' /tmp/docker-homologation.html
              grep -q 'Consultoria empresarial padrão (TaxAgent)' /tmp/docker-homologation.html
              grep -q 'Congelar Prepared DPS' /tmp/docker-homologation.html
              grep -q 'operations/dps/prepare' /tmp/docker-homologation.html
              curl --fail --silent --show-error http://127.0.0.1:3000/v1/homologation/autopilot > /tmp/docker-autopilot.html
              grep -q 'Autopilot fiscal' /tmp/docker-autopilot.html
              grep -q 'Resolver e preparar automaticamente' /tmp/docker-autopilot.html
              grep -q 'fiscal/autopilot' /tmp/docker-autopilot.html
              curl --fail --silent --show-error http://127.0.0.1:3000/v1/homologation/company-correction > /tmp/docker-company-correction.html
              grep -q 'Corrigir cadastro da Company' /tmp/docker-company-correction.html
              echo 'Final Docker runtime smoke test: OK'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/taxagent-docker.log
          exit 1
