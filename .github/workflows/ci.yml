name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taxagent
          POSTGRES_PASSWORD: taxagent
          POSTGRES_DB: taxagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxagent -d taxagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taxagent:taxagent@127.0.0.1:5432/taxagent
      TAXAGENT_MASTER_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TAXAGENT_BOOTSTRAP_TOKEN: ci-bootstrap-token
      TAXAGENT_AUTH_MODE: required
      TAXAGENT_HOMOLOGATION_CONSOLE_ENABLED: 'true'
      TAXAGENT_NFSE_MODE: mock
      TAXAGENT_LIVE_ENABLED: 'false'
      TAXAGENT_DPS_BUILDER_MODE: draft
      NFSE_TEST_BASE_URL: https://sefin.producaorestrita.nfse.gov.br/API/SefinNacional
      NFSE_PRODUCTION_BASE_URL: https://sefin.nfse.gov.br/SefinNacional
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run database migrations
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Boot API and smoke-test browser console against PostgreSQL
        run: |
          npm start > /tmp/taxagent-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              curl --fail --silent --show-error http://127.0.0.1:3000/v1/homologation > /tmp/homologation.html
              grep -q 'Console de Homologação' /tmp/homologation.html
              grep -q 'certificates/upload' /tmp/homologation.html
              echo 'Browser homologation console smoke test: OK'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/taxagent-api.log
          exit 1
      - name: Build and boot deployable Docker image
        run: |
          docker build -t taxagent-ci .
          docker run --rm --entrypoint /bin/sh taxagent-ci -c "test -f dist/database/migrate-cli.js && test -f tax-domains/registry.json && test -f schemas/registry.json && xmllint --version >/dev/null"
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TAXAGENT_MASTER_KEY_B64="$TAXAGENT_MASTER_KEY_B64" \
            -e TAXAGENT_BOOTSTRAP_TOKEN="$TAXAGENT_BOOTSTRAP_TOKEN" \
            -e TAXAGENT_AUTH_MODE=required \
            -e TAXAGENT_HOMOLOGATION_CONSOLE_ENABLED=true \
            -e TAXAGENT_NFSE_MODE=mock \
            -e TAXAGENT_LIVE_ENABLED=false \
            -e TAXAGENT_DPS_BUILDER_MODE=draft \
            -e NFSE_TEST_BASE_URL="$NFSE_TEST_BASE_URL" \
            -e NFSE_PRODUCTION_BASE_URL="$NFSE_PRODUCTION_BASE_URL" \
            taxagent-ci > /tmp/taxagent-docker.log 2>&1 &
          DOCKER_PID=$!
          trap 'kill $DOCKER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/v1/health > /tmp/docker-health.json; then
              cat /tmp/docker-health.json
              curl --fail --silent --show-error http://127.0.0.1:3000/v1/homologation > /tmp/docker-homologation.html
              grep -q 'Console de Homologação' /tmp/docker-homologation.html
              grep -q 'certificates/upload' /tmp/docker-homologation.html
              echo 'Final Docker runtime smoke test: OK'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/taxagent-docker.log
          exit 1
