name: nfse-schema-watch

on:
  workflow_dispatch:
  push:
    branches: [agent/engine-v0.1]
    paths:
      - '.github/workflows/schema-watch.yml'
      - 'schemas/registry.json'
      - 'src/xml-engine/dps-builder.service.ts'
      - 'src/xml-engine/nfse-datetime.ts'
      - 'scripts/validate-prodrest-dps-schema.ts'
  schedule:
    - cron: '17 7 * * *'

jobs:
  verify-official-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Install XML schema validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Download and inspect Produção Restrita NFS-e schemas
        run: npm run schemas:sync -- --environment=test
      - name: Verify manifest was produced
        run: test -f schemas/vendor/nfse-prodrest-v1.01-20260727/manifest.json
      - name: Validate TaxAgent-generated DPS against official XSD
        run: npx tsx scripts/validate-prodrest-dps-schema.ts
      - name: Upload official schema snapshot for review
        uses: actions/upload-artifact@v4
        with:
          name: nfse-prodrest-schema-${{ github.sha }}
          path: schemas/vendor/nfse-prodrest-v1.01-20260727/
          if-no-files-found: error
          retention-days: 14
