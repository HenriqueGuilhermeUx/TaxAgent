services:
  - type: web
    name: taxagent-homologation
    runtime: docker
    plan: free
    region: virginia
    branch: agent/engine-v0.1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /v1/health
    renderSubdomainPolicy: enabled
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taxagent-homologation-db
          property: connectionString
      - key: TAXAGENT_MASTER_KEY_B64
        generateValue: true
      - key: TAXAGENT_BOOTSTRAP_TOKEN
        generateValue: true
      - key: TAXAGENT_AUTH_MODE
        value: required
      - key: TAXAGENT_HOMOLOGATION_CONSOLE_ENABLED
        value: "true"
      - key: TAXAGENT_NFSE_MODE
        value: mock
      - key: TAXAGENT_LIVE_ENABLED
        value: "false"
      - key: TAXAGENT_DPS_BUILDER_MODE
        value: draft
      - key: TAXAGENT_ALLOW_CUSTOM_NFSE_ENDPOINTS
        value: "false"
      - key: NFSE_TEST_BASE_URL
        value: https://sefin.producaorestrita.nfse.gov.br/API/SefinNacional
      - key: NFSE_PRODUCTION_BASE_URL
        value: https://sefin.nfse.gov.br/SefinNacional
      - key: NFSE_TEST_PARAMETERS_BASE_URL
        value: https://adn.producaorestrita.nfse.gov.br
      - key: NFSE_PRODUCTION_PARAMETERS_BASE_URL
        value: https://adn.nfse.gov.br

databases:
  - name: taxagent-homologation-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: taxagent
    user: taxagent
    ipAllowList: []
